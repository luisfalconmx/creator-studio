[package]
name = "tauri-plugin-downloads"
description = "Creator Studio: descargador de videos y audio impulsado por yt-dlp"
links = "tauri-plugin-downloads"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
# Uses the OS TLS stack (Security.framework / SChannel / OpenSSL).
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
scraper = "0.29.0"
regex = "1.13.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-plugin.workspace = true
