[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "1.1.0"
authors = ["luisfalconmx"]
license = "MIT"
repository = "https://github.com/luisfalconmx/creator-studio"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin = { version = "2", features = ["build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
