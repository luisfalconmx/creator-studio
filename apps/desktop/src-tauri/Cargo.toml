[package]
name = "creator-studio"
description = "Creator Studio: videos, imágenes y descargas en una sola app"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows
name = "creator_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
tauri-plugin-videos = { path = "../../../crates/videos" }
tauri-plugin-images = { path = "../../../crates/images" }
tauri-plugin-downloads = { path = "../../../crates/downloads" }
